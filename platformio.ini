; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
;  MeshCore=https://github.com/meshcore-dev/MeshCore.git#main
  MeshCore=https://github.com/fdlamotte/MeshCore.git#remove_target_h_dep
;  MeshCore=file://../MeshCore
extra_scripts=pre:pre_build.py
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.525
  -D LORA_BW=250
  -D LORA_SF=11
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8
  -I src
build_src_filter=+<*.cpp>

[env:SenseCap_ESPNow]
extends = arduino_base
board = esp32-s3-devkitc-1
platform = platformio/espressif32@^6.11.0
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default.csv
build_flags =
  ${arduino_base.build_flags}
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  -D DISPLAY_CLASS=SCIndicatorDisplay
  -D DISPLAY_LINES=21
  -D LINE_LENGTH=53
  -D DISABLE_WIFI_OTA=1
  -D MESH_DEBUG=1
  -D IO_EXPANDER=0x40
  -D IO_EXPANDER_IRQ=42
  -D UI_ZOOM=1
  -D HAS_TOUCH
  -I variants/sc_indicator-espnow
build_src_filter = ${arduino_base.build_src_filter}
  +<../variants/sc_indicator-espnow/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
lib_deps = ${arduino_base.lib_deps}
  adafruit/Adafruit BusIO @ ^1.17.2
  lovyan03/LovyanGFX @ ^1.2.7
